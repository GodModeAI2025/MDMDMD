name: Skriptum
options:
  bundleIdPrefix: com.mobilebox
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Skriptum.entitlements
    DEVELOPMENT_TEAM: SP73Z8JWXM
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Skriptum:
    type: application
    platform: iOS
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ScriptumPCCProvisioned: true
        UILaunchStoryboardName: LaunchScreen
        CKSharingSupported: true
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mobilebox.Skriptum.scheduled-processing]
        NSLocalNetworkUsageDescription: Scriptum benötigt Zugriff, um den von Ihnen gewählten Sprachprüfungsserver im lokalen Netzwerk zu erreichen.
    sources:
      - Sources/SkriptumApp
      - Sources/SkriptumCore
      - Sources/SkriptumDocuments
      - Sources/SkriptumAI
      - Sources/SkriptumAssistant
      - Sources/SkriptumAuth
      - Sources/SkriptumExport
      - Sources/SkriptumExportUI
      - Sources/SkriptumBlocks
      - Sources/SkriptumPageTools
      - Modules/SkriptumScheduling/Sources/SkriptumScheduling
      - Modules/SkriptumWritingQuality/Sources/SkriptumWritingQuality
      - Modules/SkriptumWorkspaceClient/Sources/SkriptumWorkspaceClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.Skriptum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scriptum
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: FoundationModelsUtilities
        product: FoundationModelsUtilities
packages:
  FoundationModelsUtilities:
    url: https://github.com/apple/foundation-models-utilities.git
    revision: cc3820def1fe016bc6cd49d958cd2f2a29be76a8
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    revision: 25cb61d3482054b09ae76ca4f281b1bfe7fe5a43
schemes:
  Skriptum:
    build:
      targets:
        Skriptum: all
    run:
      config: Debug
    archive:
      config: Release
