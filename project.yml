name: Skriptum
options:
  bundleIdPrefix: com.mobilebox
  deploymentTarget:
    iOS: '27.0'
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Skriptum.entitlements
    DEVELOPMENT_TEAM: SP73Z8JWXM
    MARKETING_VERSION: '1.0.2'
    CURRENT_PROJECT_VERSION: '35'
  configs:
    Debug:
      SCRIPTUM_APS_ENVIRONMENT: development
      SCRIPTUM_ICLOUD_ENVIRONMENT: Development
    Release:
      SCRIPTUM_APS_ENVIRONMENT: production
      SCRIPTUM_ICLOUD_ENVIRONMENT: Production
targets:
  Skriptum:
    type: application
    platform: iOS
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ScriptumPCCProvisioned: true
        ScriptumICloudProvisioned: true
        UILaunchStoryboardName: LaunchScreen
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown und Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown, text/x-markdown]
        CKSharingSupported: true
        UIBackgroundModes: [processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.mobilebox.Skriptum.scheduled-processing]
    sources:
      - Sources/SkriptumApp
      - Sources/SkriptumCore
      - Sources/SkriptumDocuments
      - Sources/SkriptumAI
      - Sources/SkriptumAssistant
      - Sources/SkriptumAuth
      - Sources/SkriptumExport
      - Sources/SkriptumExportUI
      - Sources/SkriptumBlocks
      - Sources/SkriptumPageTools
      - Modules/SkriptumScheduling/Sources/SkriptumScheduling
      - path: Modules/SkriptumWritingQuality/Sources/SkriptumWritingQuality
        excludes:
          - LanguageToolClient.swift
          - BundledGrammarRuntime.swift
          - BundledRuleReviewer.swift
          - RuleResponseDecoder.swift
      - Modules/SkriptumWorkspaceClient/Sources/SkriptumWorkspaceClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.Skriptum
        CURRENT_PROJECT_VERSION: '37'
        MARKETING_VERSION: '1.0.3'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scriptum
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: FoundationModelsUtilities
        product: FoundationModelsUtilities
  SkriptumMac:
    type: application
    platform: macOS
    sources:
      - Sources/SkriptumMacApp
      - Sources/SkriptumDocuments
      - Sources/SkriptumCore
      - Sources/SkriptumAI
      - Sources/SkriptumAuth
      - Sources/SkriptumExport
      - Sources/SkriptumExportUI
      - Sources/SkriptumBlocks
      - Modules/SkriptumScheduling/Sources/SkriptumScheduling
      - path: Modules/SkriptumWritingQuality/Sources/SkriptumWritingQuality
        excludes:
          - LanguageToolClient.swift
          - BundledGrammarRuntime.swift
          - BundledRuleReviewer.swift
          - RuleResponseDecoder.swift
      - Modules/SkriptumWorkspaceClient/Sources/SkriptumWorkspaceClient
      - Sources/SkriptumApp/WritingLibrary.swift
      - Sources/SkriptumApp/ICloudSyncEngine.swift
      - Sources/SkriptumApp/ICloudChangeHints.swift
      - Sources/SkriptumApp/ICloudForegroundRefresh.swift
      - Sources/SkriptumApp/ICloudForegroundScenes.swift
      - Sources/SkriptumApp/ICloudOwnerConnectionChoice.swift
      - Sources/SkriptumApp/ICloudShareRecordBuilder.swift
      - Sources/SkriptumApp/ICloudShareOwnerTransport.swift
      - Sources/SkriptumApp/ICloudShareParticipantTransport.swift
      - Sources/SkriptumApp/ICloudSharedSnapshotReceiver.swift
      - Sources/SkriptumApp/ICloudSharedChangeSender.swift
      - Sources/SkriptumApp/ICloudSharedSession.swift
      - Sources/SkriptumApp/ICloudSharedCatalog.swift
      - Sources/SkriptumApp/ICloudPageConflict.swift
      - Sources/SkriptumApp/LocalScheduleAuthority.swift
      - Sources/SkriptumApp/LocalScheduleDispatcher.swift
      - Sources/SkriptumApp/ScheduledAIExecutor.swift
      - Sources/SkriptumApp/LocalScheduleSession.swift
      - Sources/SkriptumApp/LocalTasksSheet.swift
      - Sources/SkriptumApp/ICloudLibrarySession.swift
      - Sources/SkriptumApp/RecoveredDraftModels.swift
      - Sources/SkriptumApp/WorkspaceFileTypes.swift
      - Sources/SkriptumApp/WritingNavigation.swift
      - Sources/SkriptumApp/WorkspaceWindowRegistry.swift
      - Sources/SkriptumApp/CloudConnectionRegistry.swift
      - Sources/SkriptumApp/WorkspaceDeploymentConfiguration.swift
      - Sources/SkriptumApp/WorkspaceAccountState.swift
      - Sources/SkriptumApp/WorkspaceAccountCoordinator.swift
      - Sources/SkriptumApp/WorkspaceSystemContainerRoots.swift
      - Sources/SkriptumApp/WorkspaceAccountPresentation.swift
      - Sources/SkriptumApp/WorkspaceLibraryDiscoveryAccess.swift
      - Sources/SkriptumApp/WorkspaceLibraryPickerPresentation.swift
      - Sources/SkriptumApp/WorkspaceLibraryPickerCoordinator.swift
      - Sources/SkriptumApp/WorkspaceAccountRuntime.swift
      - Sources/SkriptumApp/WorkspaceDeploymentBundleLoader.swift
      - Sources/SkriptumPageTools/LibraryPageTools.swift
      - Sources/SkriptumPageTools/WorkflowSupport.swift
      - Sources/SkriptumPageTools/BlockMutation.swift
      - Sources/SkriptumPageTools/TemplatePickerSheet.swift
      - Sources/SkriptumPageTools/MarkdownFolderImportSheet.swift
      - Sources/SkriptumPageTools/PageLinksSheet.swift
      - Sources/SkriptumPageTools/AttachmentDashboardSheet.swift
      - Sources/SkriptumApp/PageTableSession.swift
      - Sources/SkriptumPageTools/WritingPreferencesStorage.swift
      - Sources/SkriptumPageTools/EditorNotification.swift
      - Sources/SkriptumAssistant
      - Sources/SkriptumApp/PaperAppearance.swift
      - Sources/SkriptumApp/Assets.xcassets
      - Sources/SkriptumApp/Settings.bundle
      - Sources/SkriptumApp/PrivacyInfo.xcprivacy
      - Sources/SkriptumApp/PageReviewPanel.swift
      - Sources/SkriptumApp/ICloudSettingsView.swift
      - Sources/SkriptumApp/ICloudConflictsSheet.swift
      - Sources/SkriptumApp/ICloudSharedWritingView.swift
      - Sources/SkriptumApp/ICloudSharedCatalogView.swift
      - Sources/SkriptumPageTools/WritingQualitySheet.swift
      - Sources/SkriptumPageTools/WritingPreferencesSheet.swift
    info:
      path: Config/Info-Mac.plist
      properties:
        CFBundleDisplayName: Scriptum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ScriptumPCCProvisioned: true
        ScriptumICloudProvisioned: true
        CKSharingSupported: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown und Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown, text/x-markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.Skriptum
        PRODUCT_NAME: Scriptum
        CURRENT_PROJECT_VERSION: '38'
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Config/SkriptumMac.entitlements
        TARGETED_DEVICE_FAMILY: ''
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: MacAccentColor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: FoundationModelsUtilities
        product: FoundationModelsUtilities
packages:
  FoundationModelsUtilities:
    url: https://github.com/apple/foundation-models-utilities.git
    revision: cc3820def1fe016bc6cd49d958cd2f2a29be76a8
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    revision: 25cb61d3482054b09ae76ca4f281b1bfe7fe5a43
schemes:
  Skriptum:
    build:
      targets:
        Skriptum: all
    run:
      config: Debug
    archive:
      config: Release
  SkriptumMac:
    build:
      targets:
        SkriptumMac: all
    run:
      config: Debug
    archive:
      config: Release
