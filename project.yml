name: Skriptum
options:
  bundleIdPrefix: com.mobilebox
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SP73Z8JWXM
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Skriptum:
    type: application
    platform: iOS
    sources:
      - Sources/SkriptumApp
      - Sources/SkriptumCore
      - Sources/SkriptumDocuments
      - Sources/SkriptumAI
      - Sources/SkriptumAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.Skriptum
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skriptum
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
schemes:
  Skriptum:
    build:
      targets:
        Skriptum: all
    run:
      config: Debug
    archive:
      config: Release
